<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DebAI</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f12;
      color: #f5f5f5;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #9a9a9f; font-size: 15px; line-height: 1.5; }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #ff6b57;
      color: #0f0f12;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card" id="content">
    <h1>Página no encontrada</h1>
    <p>Este link no existe o ya no está disponible.</p>
  </div>
  <script>
    // GitHub Pages no soporta rutas dinámicas en un sitio estático — este
    // 404.html es el catch-all para cualquier path sin archivo propio,
    // incluido `/invite/{token}` (el App Link de una invitación cuando
    // quien lo toca no tiene la app instalada). El token no se usa acá:
    // solo distingue el copy, no hay nada que resolver del lado del sitio.
    if (location.pathname.startsWith('/invite/')) {
      document.getElementById('content').innerHTML =
        '<h1>Te invitaron a una lista en DebAI</h1>' +
        '<p>Para unirte necesitás tener la app instalada. Descargala y volvé a abrir este mismo link.</p>';
        // TODO: agregar el botón real a Play Store / App Store cuando la
        // app esté publicada. Ej:
        // '<a class="button" href="https://play.google.com/store/apps/details?id=com.debai.app">Descargar en Google Play</a>'
    }
  </script>
</body>
</html>
