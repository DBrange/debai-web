<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DebAI</title>
  <style>
    @font-face {
      font-family: "Nunito";
      src: url("/legal/assets/fonts/Nunito-VariableFont_wght.ttf") format("truetype");
      font-weight: 200 1000;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1f2330;
      --text-soft: #565d6d;
      --muted: #8a90a0;
      --border: #e6e8ee;
      --brand: #F26654;
      --brand-soft: #fdece8;
      --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 12px 32px rgba(20, 24, 40, .06);
    }
    :root { color-scheme: light; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 36px 28px;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      object-fit: cover;
      margin: 0 auto 18px;
      display: block;
    }

    h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 0 0 8px; }
    p { color: var(--text-soft); font-size: 15px; line-height: 1.55; margin: 0; }

    a.button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 26px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 15px;
      box-shadow: 0 6px 16px rgba(242, 102, 84, .32);
    }
    a.button:hover { background: #e05744; }

    /* Badges de tiendas — usados por el fallback de invitación (ver script) */
    .store-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .store-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #000;
      border: 1px solid #000;
      color: #fff;
      text-decoration: none;
      text-align: left;
      line-height: 1.15;
    }
    .store-badge:hover { text-decoration: none; background: #222; }
    .store-badge svg { width: 24px; height: 24px; flex-shrink: 0; }
    .store-badge__eyebrow { display: block; font-size: 9px; letter-spacing: .03em; color: #cfcfd2; }
    .store-badge__name { display: block; font-size: 15px; font-weight: 600; }
    .store-badge--disabled { opacity: .45; cursor: default; pointer-events: none; }
  </style>
</head>
<body>
  <div class="card" id="content">
    <img class="brand-mark" src="/legal/assets/icon.webp" alt="DebAI" width="56" height="56" />
    <h1>Página no encontrada</h1>
    <p>Este link no existe o ya no está disponible.</p>
    <a class="button" href="/">Ir al inicio</a>
  </div>
  <script>
    // GitHub Pages no soporta rutas dinámicas en un sitio estático — este
    // 404.html es el catch-all para cualquier path sin archivo propio,
    // incluido `/invite/{token}` (el App Link de una invitación cuando
    // quien lo toca no tiene la app instalada). El token no se usa acá:
    // solo distingue el copy, no hay nada que resolver del lado del sitio.
    if (location.pathname.startsWith('/invite/')) {
      document.getElementById('content').innerHTML =
        '<img class="brand-mark" src="/legal/assets/icon.webp" alt="DebAI" width="56" height="56" />' +
        '<h1>Te invitaron a una lista en DebAI</h1>' +
        '<p>Para unirte necesitás tener la app instalada. Descargala y volvé a abrir este mismo link.</p>' +
        '<div class="store-badges">' +
          // TODO: reemplazar '#' por la URL real de App Store Connect cuando
          // la app salga a la luz en iOS. Hasta entonces el badge queda
          // deshabilitado (sin href funcional) para no linkear a un 404 de Apple.
          '<span class="store-badge store-badge--disabled" aria-disabled="true">' +
            '<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.29-.03-.015-.06-.045-.226-.045-.394 0-1.13.559-2.27 1.208-2.99.744-.85 2.033-1.51 3.075-1.55.015.1.03.2.03.31zm4.09 16.05c-.075.15-.55 1.03-1.5 2.35-.998 1.5-2.033 2.99-3.5 3.02-1.42.03-1.88-.84-3.5-.84-1.63 0-2.14.81-3.49.87-1.41.06-2.5-1.62-3.5-3.12C3.98 16.63 2.7 12.24 4.5 9.36c.9-1.43 2.5-2.34 4.25-2.37 1.36-.03 2.64.9 3.5.9.85 0 2.42-1.11 4.08-.95.7.03 2.65.28 3.9 2.13-.1.06-2.33 1.34-2.3 4.05.02 3.13 2.8 4.36 2.83 4.38z"/></svg>' +
            '<span><span class="store-badge__eyebrow">Próximamente en</span><span class="store-badge__name">App Store</span></span>' +
          '</span>' +
          '<a class="store-badge" href="https://play.google.com/store/apps/details?id=com.debai.app" target="_blank" rel="noopener">' +
            '<svg viewBox="0 0 24 24"><path fill="#00d9ff" d="M3.6 2.4 14.3 12 3.6 21.6c-.35-.2-.6-.58-.6-1.02V3.42c0-.44.25-.82.6-1.02z"/><path fill="#ffd400" d="M17.9 9.6 14.3 12l3.6 2.4 3.55-2c.6-.34.6-1.06 0-1.4z"/><path fill="#00f076" d="M14.3 12 3.6 2.4c.14-.08.3-.12.46-.12.16 0 .33.04.5.13l12.34 6.99z"/><path fill="#ff3a44" d="M14.3 12 3.6 21.6c.14.08.3.12.46.12.16 0 .33-.04.5-.13l12.34-6.99z"/></svg>' +
            '<span><span class="store-badge__eyebrow">Disponible en</span><span class="store-badge__name">Google Play</span></span>' +
          '</a>' +
        '</div>';
    }
  </script>
</body>
</html>
